<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>freee 所定労働時間カード — ローカルプレビュー</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
        font-size: 13px;
        color: #1a2733;
        background: #f5f7f9;
      }
      .harness {
        max-width: 1100px;
        margin: 0 auto;
      }
      .harness__controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding: 12px 16px;
        border: 1px solid #d8dde3;
        border-radius: 8px;
        background: #fffbe6;
      }
      .harness__controls select,
      .harness__controls button {
        font: inherit;
        padding: 4px 8px;
      }
      .harness__count {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      #app {
        padding: 16px;
        border: 1px solid #d8dde3;
        border-radius: 8px;
        background: #ffffff;
      }
      /* フィクスチャ側のテーブルを見やすくするだけの装飾（拡張機能とは無関係） */
      #app table {
        border-collapse: collapse;
        font-size: 12px;
      }
      #app th,
      #app td {
        padding: 2px 8px;
        border: 1px solid #e6eaee;
        text-align: left;
        white-space: nowrap;
      }
      #app .vb-summary {
        display: flex;
        gap: 24px;
        margin: 12px 0;
      }
      #app .vb-summary__item {
        display: flex;
        flex-direction: column;
      }
      #app .vb-summary__label {
        font-size: 11px;
        color: #6b7a89;
      }
      #app .vb-summary__value {
        font-size: 16px;
        font-weight: 600;
      }
      #app .vb-calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      #app .vb-calendar__cell {
        padding: 4px;
        border: 1px solid #e6eaee;
        font-size: 11px;
      }
    </style>
  </head>

        <span class="harness__count" id="count"></span>
      </div>
      <div id="app"></div>
    </div>
