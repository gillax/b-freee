name: test

# main への push と、すべての pull request で単体テストを実行する。
# ブランチ保護の必須ステータスチェックに指定しておくことで、テストが通らない
# PR はマージできなくなる。

on:
  push:
    branches: [main]
  pull_request:

# 最小権限：このジョブはチェックアウトしたコードを読むだけ。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # action は動くタグではなくコミット SHA で固定する。タグの付け替えや
      # リリースの改竄によって別のコードが CI で実行されるのを防ぐため。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # インストールするものは無い。テストは Node 組み込みの test runner
      # （node:test）だけを使い、src/lib/* の純粋関数を検証する。
      - name: Run unit tests
        run: node --test

      # 拡張機能本体（content script / options）は Node から実行できないので、
      # 少なくとも構文エラーが無いことを確認する。
      - name: Syntax check all sources
        run: |
          for file in $(find src test test-helpers -name '*.js'); do
            node --check "$file"
          done

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
