<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="所定労働時間カード">
  <!--
    32x32 グリッドで描いたアイコン。scripts/make-icons.sh が
    icons/icon-{32,48,128}.png を、icon-16.svg が icon-16.png を生成する。

    モチーフ：時計の文字盤に「所定までの残り」を表す扇形を重ねたもの。
    freee のロゴやブランドカラーは使っていない（商標を模さないため）。
  -->
  <rect width="32" height="32" rx="7" fill="#0b6e8a" />

  <!-- 文字盤 -->
  <circle cx="16" cy="16" r="10" fill="#ffffff" />

  <!-- 残り時間を表す扇形（12 時から約 4 時方向まで） -->
  <path d="M16 16 L16 6 A10 10 0 0 1 24.66 21 Z" fill="#8fd3e4" />

  <!-- 針 -->
  <path
    d="M16 16 L16 8.5"
    stroke="#0b6e8a"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M16 16 L21.5 19"
    stroke="#0b6e8a"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="16" cy="16" r="1.6" fill="#0b6e8a" />
</svg>
